name: Build Windows Executable

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies and Nuitka
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nuitka zstandard

      - name: Build native Windows .exe with Nuitka
        run: |
          python -m nuitka --standalone --mingw64 --assume-yes-for-downloads --windows-console-mode=disable --enable-plugin=tk-inter --output-dir=dist --output-filename=BAF_Simple_Student_Register.exe main.py

      - name: Upload Windows app artifact
        uses: actions/upload-artifact@v4
        with:
          name: BAF_Simple_Student_Register_Windows
          path: dist/main.dist/
