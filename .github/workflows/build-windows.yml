name: Build Windows Executable

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies and PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Generate application icon (.ico)
        run: |
          python -c "
          import sys
          from PySide6.QtWidgets import QApplication
          from main import create_app_icon
          app = QApplication(sys.argv)
          icon = create_app_icon()
          icon.pixmap(256, 256).save('app_icon.ico', 'ICO')
          "

      - name: Build standalone Windows app folder with PyInstaller
        run: |
          pyinstaller --noconfirm --onedir --windowed --noupx --icon=app_icon.ico --name "BAF_Simple_Student_Register" main.py

      - name: Upload Windows app artifact
        uses: actions/upload-artifact@v4
        with:
          name: BAF_Simple_Student_Register_Windows
          path: dist/BAF_Simple_Student_Register/
